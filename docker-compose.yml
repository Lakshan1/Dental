services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dental_db
      MYSQL_USER: dental_app
      MYSQL_PASSWORD: dental_app_pw
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: dental_db
      DB_USER: dental_app
      DB_PASSWORD: dental_app_pw
      # Notification credentials: real values come from .env (gitignored, not
      # committed). Blank here is fine - EmailService/SmsService just skip
      # sending and log when these aren't set.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-}
      NOTIFYLK_USER_ID: ${NOTIFYLK_USER_ID:-}
      NOTIFYLK_API_KEY: ${NOTIFYLK_API_KEY:-}
      NOTIFYLK_SENDER_ID: ${NOTIFYLK_SENDER_ID:-}
    ports:
      - "8080:8080"

volumes:
  db_data: